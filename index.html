<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angel Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5fbff;
      color: #333;
    }

    header {
      background: #a9dcf5;
      padding: 20px;
      text-align: center;
    }

    header img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
    }

    h1 {
      margin-top: 10px;
      color: white;
    }

    .hero {
      text-align: center;
      padding: 30px 15px;
    }

    .hero h2 {
      color: #65b9df;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 14px;
    }

    .product h3 {
      margin: 12px 0 6px;
      color: #555;
    }

    .price {
      color: #5bb4dc;
      font-weight: bold;
      font-size: 18px;
    }

    .order {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      background: #8fd1ed;
      color: white;
      text-decoration: none;
      border-radius: 20px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 20px;
      background: #a9dcf5;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <img src="file_00000000942082108f850558b43d7ae7.png" alt="Angel Store">
    <h1>Angel Store</h1>
  </header>

  <section class="hero">
    <h2>إكسسوارات تضيف لمستك ✨</h2>
    <p>اختاري إكسسواراتك المفضلة من Angel Store</p>
  </section>

  <section class="products">

    <div class="product">
      <img src="IMG_20261003_013720_177.jpg" alt="منتج Angel Store">
      <h3>إكسسوار Angel Store</h3>
      <div class="price">السعر: يحدد لاحقاً</div>
      <a class="order" href="#">طلب المنتج</a>
    </div>

  </section>

  <footer>
    Angel Store ✨
  </footer>

</body>
</html>
