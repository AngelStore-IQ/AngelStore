<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Store</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5fbff;
  color:#333;
}

header{
  background:#a9dcf5;
  text-align:center;
  padding:20px;
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain;
  border-radius:50%;
  background:white;
}

header h1{
  color:white;
  margin:10px 0 0;
}

.hero{
  text-align:center;
  padding:25px 15px;
}

.hero h2{
  color:#65b9df;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  padding:20px;
  max-width:1000px;
  margin:auto;
}

.product{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  text-align:center;
}

.photos{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.photos img{
  width:180px;
  height:200px;
  object-fit:cover;
  border-radius:14px;
  flex-shrink:0;
}

.product h3{
  margin:12px 0 8px;
}

.price{
  color:#55add6;
  font-weight:bold;
  font-size:18px;
}

.order{
  display:inline-block;
  margin-top:12px;
  padding:10px 20px;
  background:#8fd1ed;
  color:white;
  text-decoration:none;
  border-radius:20px;
}

footer{
  margin-top:30px;
  padding:25px;
  text-align:center;
  background:#a9dcf5;
  color:white;
}
</style>
</head>

<body>

<header>
  <img class="logo" src="file_00000000942082108f850558b43d7ae7.png">
  <h1>Angel Store</h1>
</header>

<section class="hero">
  <h2>إكسسوارات تضيف لمستك ✨</h2>
  <p>اختاري إكسسواراتك المفضلة</p>
</section>

<section class="products">

  <!-- المنتج الأول -->
  <div class="product">

    <div class="photos">
      <img src="IMG_20261003_022350_879.jpg">
      <img src="IMG_20261003_013720_177.jpg">
    </div>

    <h3>إكسسوار Angel Store</h3>

    <div class="price">
      10,000 دينار
    </div>

    <a class="order" href="#">
      طلب المنتج
    </a>

  </div>

</section>

<footer>
  Angel Store ✨
</footer>

</body>
</html>
